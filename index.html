*{box-sizing:border-box}html{scroll-behavior:smooth}

 const draw=()=>{const l=[...sel].sort((a,b)=>a-b),msg=l.length?buyMsg(l):'';
  $('#bl').innerHTML=locked.map(i=>`<button type="button" class="sel${sel.has(i)?' on':''}" data-i="${i}"><span>${i+1}-test</span><small>${money(CFG.price)}</small></button>`).join('');
  $('#bs').innerHTML=l.length?`<div class="tot"><span>${l.length} ta test</span><b>${money(l.length*CFG.price)} so‘m</b></div><pre class="msg">${esc(msg)}</pre><div class="act2">${ext(ADMIN,'Telegramda adminga yozish','btn')}<button class="ghost" type="button" id="cm">Xabarni nusxalash</button></div><p class="mut sm">Xabarni nusxalab, adminga yuboring. Admin to‘lov uchun karta raqamini beradi va to‘lovdan so‘ng har bir test uchun alohida kod yuboradi.</p>`:`<p class="mut">Ochmoqchi bo‘lgan testlarni tanlang.</p>`;
  document.querySelectorAll('#bl .sel').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);draw()});
  const cm=$('#cm');if(cm)cm.onclick=()=>copyTxt(msg,cm)};
 root.innerHTML=shell(`<h1 class="h1">Testlarni ochish</h1><p class="mut">Har bir test — <b>${money(CFG.price)} so‘m</b>, muddatsiz. Testlarni tanlang va adminga murojaat qiling.</p>
 <div class="buygrid"><div><div class="bh"><b>Testni tanlang</b><span><button class="ghost sm" type="button" id="sa">Hammasini tanlash</button> <button class="ghost sm" type="button" id="sn">Tozalash</button></span></div><div id="bl" class="sels"></div></div><aside class="bside"><h3>Buyurtma</h3><div id="bs"></div></aside></div>
 <h2 class="sec">Kodingiz bormi?</h2><div class="codebox"><select id="cs">${locked.map(i=>`<option value="${i}">${i+1}-test</option>`).join('')}</select><input id="cc" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn" type="button" id="cb">Ochish</button></div><div id="ce" class="err"></div>
 <h2 class="sec">Murojaat</h2><div class="contact">${contactCards()}</div>`,'buy');bindShell();
 draw();$('#sa').onclick=()=>{locked.forEach(i=>sel.add(i));draw()};$('#sn').onclick=()=>{sel.clear();draw()};
 const act=async()=>{const i=+$('#cs').value;if(await tryUnlock(i,$('#cc').value,$('#ce'),$('#cb')))ask(`${i+1}-test ochildi!`,'Boshlash',()=>go('start',i),false)};
 $('#cb').onclick=act;$('#cc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();act()}})}
function contactCards(){return [[ADMIN,'Admin','@'+CFG.admin,'Testlarni sotib olish va savollar uchun'],[BOT,'Murojaat boti','@'+CFG.bot,'Tezkor murojaat uchun bot'],[ATT,'Attestatsiya kanali','Digital_Ustoz_AT','Attestatsiya bo‘yicha yangiliklar'],[CHAN,'Asosiy kanal','@'+CFG.channel,'Digital Ustoz Informatika kanali']].map(([u,t,h,d])=>`<a class="card cc" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><h4>${t}</h4><b>${esc(h)}</b><p>${d}</p></a>`).join('')}
function viewAbout(){
 root.innerHTML=shell(`<section class="ahero"><p class="brand">Digital Ustoz Informatika</p><h1>${esc(CFG.tagline)}</h1><p class="lead">LEVEL UP — Digital Ustoz Informatika kanalining test platformasi. Muallif: <b>Anvarbek Toshmamatov</b>.</p></section>
 <h2 class="sec">Yo‘nalishlar</h2><div class="grid3"><div class="card pcard"><div class="pi">1</div><h3>Attestatsiya</h3><p>Informatika o‘qituvchilarining attestatsiyasiga tayyorgarlik: test savollari va to‘liq tahlil.</p>${ext(ATT,'Kanalga o‘tish →','lnk')}</div>
 <div class="card pcard"><div class="pi">2</div><h3>IC3 xalqaro sertifikat</h3><p>Raqamli savodxonlik bo‘yicha xalqaro IC3 sertifikatiga tayyorgarlik.</p>${ext(BOT,'Murojaat uchun bot →','lnk')}</div>
 <div class="card pcard"><div class="pi">3</div><h3>AI — sun’iy intellekt</h3><p>Sun’iy intellekt asoslari va uni amaliyotda qo‘llashni o‘rganish.</p>${ext(ADMIN,'Adminga yozish →','lnk')}</div></div>
 <h2 class="sec">Aloqa</h2><div class="contact">${contactCards()}</div>
 <h2 class="sec">Platforma haqida</h2><div class="faq">
 <details><summary>Testlarni qanday sotib olaman?</summary><p>“Testlarni ochish” bo‘limida kerakli testlarni tanlang, tayyor xabarni adminga (@${esc(CFG.admin)}) yuboring. Admin to‘lov uchun karta raqamini beradi. To‘lovdan so‘ng har bir test uchun alohida kod olasiz va uni kiritasiz.</p></details>
 <details><summary>1-test bepulmi?</summary><p>Ha, 1-test hamma uchun ochiq. Qolgan 27 ta testning har biri ${money(CFG.price)} so‘m.</p></details>
 <details><summary>Natijalarim qayerda saqlanadi?</summary><p>Natijalar va ochilgan testlar shu qurilma va brauzerda saqlanadi. Boshqa qurilmada kirsangiz, ochilgan testlarni kodingiz bilan qayta ochishingiz mumkin.</p></details>
 <details><summary>Kodni yo‘qotib qo‘ysam nima qilaman?</summary><p>Adminga (@${esc(CFG.admin)}) yozing, to‘lovingiz tasdiqlangach kodingiz qayta yuboriladi.</p></details>
 <details><summary>Parolimni unutdim</summary><p>Adminga yozing yoki yangi hisob oching.</p></details>
 <details><summary>XP va darajalar qanday ishlaydi?</summary><p>Har bir to‘g‘ri javob uchun 10 XP, testni yakunlaganingiz uchun +20 XP, 75% dan yuqori natijaga qo‘shimcha bonus beriladi. XP oshgani sari daraja ko‘tariladi.</p></details></div>`,'about');bindShell()}
// ---------- run test
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRun(mode,id,qs,title,dur){run={mode,id,qs,title,dur,ans:Array(qs.length).fill(-1),flag:Array(qs.length).fill(false),i:0,end:dur?Date.now()+dur*1000:0,done:false};viewRun();tick()}
let timer=null;
function tick(){clearInterval(timer);if(!run||!run.dur)return;const f=()=>{const el=$('#clock');if(!run||run.done){clearInterval(timer);return}const left=Math.max(0,Math.round((run.end-Date.now())/1000));if(el){el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');el.classList.toggle('low',left<300)}if(left<=0){clearInterval(timer);finish(true)}};f();timer=setInterval(f,1000)}
function qHTML(q,n){let h=`<div class="qno">Savol ${n}</div><div class="qtxt">${esc(q.q)}</div>`;
 if(q.code)h+=`<pre class="code">${esc(q.code)}</pre>`;
 if(q.table)h+=`<div class="qt"><table>${q.table.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 return h}
function viewRun(){
 const q=run.qs[run.i],n=run.i+1,N=run.qs.length,answered=run.ans.filter(a=>a>=0).length;
 root.innerHTML=`<header class="top run"><div class="wrap topin">${logo(1)}<div class="rt">${esc(run.title)}</div><div class="rr">${run.dur?`<span class="clock" id="clock">--:--</span>`:`<span class="chip">Mashq</span>`}<button class="btn sm" id="fin">Yakunlash</button></div></div><div class="prog"><i style="width:${answered/N*100}%"></i></div></header>
 <main class="wrap runwrap"><section class="qcard">${qHTML(q,n)}<div class="opts">${q.opts.map((o,k)=>`<button class="opt${run.ans[run.i]===k?' sel':''}" data-k="${k}"><span class="ol">${L[k]}</span><span class="ot">${esc(o)}</span></button>`).join('')}</div>
 <div class="nav"><button class="ghost" id="pv" ${run.i===0?'disabled':''}>← Oldingi</button><button class="ghost${run.flag[run.i]?' fl':''}" id="fg">${run.flag[run.i]?'⚑ Belgilangan':'⚐ Belgilash'}</button><button class="btn" id="nx">${run.i===N-1?'Yakunlash':'Keyingi →'}</button></div></section>
 <aside class="map"><h4>Savollar (${answered}/${N})</h4><div class="mg">${run.qs.map((_,k)=>`<button class="mb${k===run.i?' cur':''}${run.ans[k]>=0?' ok':''}${run.flag[k]?' fg':''}" data-j="${k}">${k+1}</button>`).join('')}</div><p class="lg"><i class="ok"></i>javob berilgan <i class="fg"></i>belgilangan</p></aside></main>`;
 saveRun();document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{run.ans[run.i]=+b.dataset.k;viewRun()});
 document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{run.i=+b.dataset.j;viewRun()});
 $('#pv').onclick=()=>{run.i--;viewRun()};$('#fg').onclick=()=>{run.flag[run.i]=!run.flag[run.i];viewRun()};
 $('#nx').onclick=()=>{if(run.i===N-1)finish(false);else{run.i++;viewRun()}};
 $('#fin').onclick=()=>finish(false);tick();window.scrollTo(0,0)}
function finish(auto){
 if(!auto){const un=run.ans.filter(a=>a<0).length;return ask(un?`${un} ta savolga javob berilmagan. Baribir yakunlaymizmi?`:'Testni yakunlaymizmi?','Yakunlash',()=>finish2())}
 finish2()}
function finish2(){
 if(!run||run.done)return;run.done=true;clearRun();clearInterval(timer);
 const total=run.qs.length;let correct=0;run.qs.forEach((q,k)=>{if(run.ans[k]===q.ans)correct++});
 const pct=Math.round(correct/total*100);const xp=correct*10+(pct>=90?50:pct>=75?25:0)+(run.mode==='test'?20:0);
 const cs={};run.qs.forEach((q,k)=>{const a=cs[q.cat]||(cs[q.cat]=[0,0]);a[1]++;if(run.ans[k]===q.ans)a[0]++});run.cats=cs;
 const rec={t:Date.now(),mode:run.mode,id:run.id,title:run.title,correct,total,pct,xp,cats:cs};
 const before=stats(me.u).lv;addResult(me.u,rec);const after=stats(me.u).lv;
 run.result={correct,total,pct,xp,lvUp:after>before?after:0};viewResult()}
function viewResult(){
 const r=run.result,col=r.pct>=75?'g':r.pct>=60?'y':'r',msg=r.pct>=90?'A’lo natija!':r.pct>=75?'Yaxshi natija!':r.pct>=60?'Qoniqarli':'Yana mashq qiling';
 root.innerHTML=shell(`${r.lvUp?`<div class="lvlup">🎉 DARAJA OSHDI! Siz endi <b>${r.lvUp}-daraja</b>dasiz</div>`:''}
 <section class="res"><div class="big ${col}"><b>${r.pct}%</b><span>${msg}</span></div><div class="rk"><div><b>${r.correct}</b><span>to‘g‘ri</span></div><div><b>${r.total-r.correct}</b><span>noto‘g‘ri / javobsiz</span></div><div><b>+${r.xp}</b><span>XP</span></div></div>
 <div class="ra"><a class="btn" href="#/tests">Testlar</a><a class="ghost b" href="#/home">Bosh sahifa</a></div></section>
 ${(()=>{const w=Object.entries(run.cats||{}).filter(([c,[a,b]])=>a<b).sort((x,y)=>(x[1][0]/x[1][1])-(y[1][0]/y[1][1]));return w.length?`<h2 class="sec">Qaysi mavzularda xato qildingiz</h2><div class="tbl"><table><thead><tr><th>Mavzu</th><th>To‘g‘ri</th><th>Aniqlik</th></tr></thead><tbody>${w.map(([c,[a,b]])=>`<tr><td>${esc(c)}</td><td>${a}/${b}</td><td><span class="pill ${a/b>=.75?'g':a/b>=.5?'y':'r'}">${Math.round(a/b*100)}%</span></td></tr>`).join('')}</tbody></table></div>`:''})()}
 <h2 class="sec">Javoblar tahlili</h2><div class="flt"><button class="ghost on" data-f="all">Barchasi</button><button class="ghost" data-f="bad">Faqat xatolar</button></div>
 <div id="rev">${run.qs.map((q,k)=>{const a=run.ans[k],ok=a===q.ans;return `<article class="rv ${ok?'ok':'bad'}" data-s="${ok?'ok':'bad'}">${qHTML(q,k+1)}<div class="opts">${q.opts.map((o,j)=>`<div class="opt ro${j===q.ans?' right':''}${j===a&&!ok?' wrong':''}"><span class="ol">${L[j]}</span><span class="ot">${esc(o)}</span>${j===q.ans?'<em>to‘g‘ri javob</em>':''}${j===a&&!ok?'<em>sizning javobingiz</em>':''}</div>`).join('')}</div>${a<0?'<p class="na">Javob berilmagan</p>':''}</article>`}).join('')}</div>`,'tests');bindShell();
 document.querySelectorAll('.flt button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.flt button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.rv').forEach(x=>x.style.display=b.dataset.f==='bad'&&x.dataset.s==='ok'?'none':'')});window.scrollTo(0,0)}
// ---------- board / profile / admin
function viewBoard(){
 const rows=allUsers().map(u=>({u,...stats(u.u)})).sort((a,b)=>b.xp-a.xp);
 root.innerHTML=shell(`<h1 class="h1">Reyting</h1><p class="mut">Ushbu qurilmadagi foydalanuvchilar XP bo‘yicha.</p><div class="tbl"><table><thead><tr><th>#</th><th>Foydalanuvchi</th><th>Daraja</th><th>XP</th><th>Aniqlik</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${x.u.u===me.u?'me':''}"><td>${i+1}</td><td>${esc(x.u.name)}</td><td>Lv ${x.lv} • ${x.title}</td><td>${x.xp}</td><td>${x.acc}%</td></tr>`).join('')}</tbody></table></div>`,'board');bindShell()}
function viewMe(){
 const s=stats(me.u),by={};s.r.forEach(x=>{by[x.title]=x});
 root.innerHTML=shell(`<h1 class="h1">Profil</h1><div class="kpis solo"><div><b>${s.lv}</b><span>${s.title}</span></div><div><b>${s.xp}</b><span>XP</span></div><div><b>${s.r.length}</b><span>urinish</span></div><div><b>${s.acc}%</b><span>aniqlik</span></div></div>
 ${(()=>{const cl=Object.entries(s.cats).map(([c,[a,b]])=>({c,a,b,p:Math.round(a/b*100)})).sort((x,y)=>x.p-y.p);return cl.length?`<h2 class="sec">Mavzular bo‘yicha tahlil</h2><div class="topbars">${cl.map(x=>`<div class="tb"><span>${esc(x.c)}</span><div class="bar sm"><i class="${x.p>=75?'g':x.p>=60?'y':'r'}" style="width:${x.p}%"></i></div><b>${x.p}%</b><small>${x.a}/${x.b}</small></div>`).join('')}</div>`:''})()}
 <h2 class="sec">Barcha urinishlar</h2>${s.r.length?`<div class="tbl"><table><thead><tr><th>Sana</th><th>Nomi</th><th>Natija</th><th>XP</th></tr></thead><tbody>${s.r.slice().reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleString('uz-UZ',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(x.title)}</td><td>${x.correct}/${x.total} • ${x.pct}%</td><td>+${x.xp}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Natijalar yo‘q</div>'}
 <h2 class="sec">Parolni o‘zgartirish</h2><div id="pf" class="form"><input id="p1" type="password" placeholder="Yangi parol (kamida 6 belgi)"><button class="btn" type="button" id="pb">Saqlash</button><span id="pm" class="mut"></span></div>`,'me');bindShell();
 $('#pb').onclick=()=>{const p=$('#p1').value;if(p.length<6){$('#pm').textContent='Parol kamida 6 belgi bo‘lsin';return}const ov=ls.get('lu_pw',{});ov[me.u.toLowerCase()]=hp(me.u,p);ls.set('lu_pw',ov);me.h=ov[me.u.toLowerCase()];$('#pm').textContent='Parol saqlandi (shu qurilmada)';$('#p1').value=''}}
function viewAdmin(){
 if(!me.admin)return go('home');
 const us=allUsers();
 root.innerHTML=shell(`<h1 class="h1">Admin panel</h1><p class="mut">Foydalanuvchilar va natijalar. Ma’lumotlar shu brauzerda saqlanadi.</p>
 <div class="tbl"><table><thead><tr><th>Login</th><th>Ism</th><th>Urinish</th><th>Ochilgan</th><th>XP</th><th>Aniqlik</th><th></th></tr></thead><tbody>${us.map(u=>{const s=stats(u.u);return `<tr><td>${esc(u.u)}</td><td>${esc(u.name)}</td><td>${s.r.length}</td><td>${Object.keys(ls.get('lu_unl_'+u.u,{})).length+1}/28</td><td>${s.xp}</td><td>${s.acc}%</td><td>${u.extra?`<button class="ghost sm" data-del="${esc(u.u)}">O‘chirish</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
 <h2 class="sec">Yangi o‘quvchi qo‘shish</h2><div id="nf" class="form"><input id="n1" placeholder="Login"><input id="n2" placeholder="Ism familiya"><input id="n3" placeholder="Parol (kamida 4 belgi)"><button class="btn" type="button" id="nb">Qo‘shish</button><span id="nm" class="mut"></span></div>
 <h2 class="sec">Eksport</h2><button class="ghost" id="csv">Natijalarni CSV yuklab olish</button>`,'admin');bindShell();
 $('#nb').onclick=()=>{const u=$('#n1').value.trim();if(!u||!$('#n2').value.trim()||$('#n3').value.length<4){$('#nm').textContent='Hamma maydonni to‘ldiring';return}if(findUser(u)){$('#nm').textContent='Bunday login bor';return}
  const a=ls.get('lu_users',[]);a.push({u,name:$('#n2').value.trim(),h:hp(u,$('#n3').value),extra:1});ls.set('lu_users',a);viewAdmin()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>ask('Foydalanuvchi o‘chirilsinmi?','O‘chirish',()=>{ls.set('lu_users',ls.get('lu_users',[]).filter(x=>x.u!==b.dataset.del));viewAdmin()}));
 $('#csv').onclick=()=>{let c='login,ism,sana,nomi,togri,jami,foiz,xp\n';us.forEach(u=>results(u.u).forEach(x=>{c+=[u.u,u.name,new Date(x.t).toISOString(),'"'+x.title+'"',x.correct,x.total,x.pct,x.xp].join(',')+'\n'}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+c],{type:'text/csv'}));a.download='natijalar.csv';a.click()}}
// ---------- router
function route(h){
 h=h||location.hash||'';cur=h;
 const [_,v,a]=h.split('/');
 if(!me&&v!=='login')return go('login');
 if(me){const ov=ls.get('lu_pw',{})[me.u.toLowerCase()];if(ov)me.h=ov}
 if(run&&!run.done&&!['start','practice','resume'].includes(v)){clearInterval(timer)}
 switch(v){
  case 'login':me?go('home'):viewLogin();break;
  case 'home':viewHome();break;
  case 'tests':viewTests();break;
  case 'topics':viewTopics();break;
  case 'board':viewBoard();break;
  case 'buy':viewBuy(a);break;
  case 'about':viewAbout();break;
  case 'me':viewMe();break;
  case 'admin':viewAdmin();break;
  case 'start':{const i=+a;if(!(i>=0&&i<T.length))return go('tests');
    if(!T[i])return viewPay(i);
    root.innerHTML=shell(`<div class="intro"><h1>${i+1}-TEST</h1><ul><li>35 ta savol</li><li>Vaqt: 50 daqiqa (tugagach test avtomatik yakunlanadi)</li><li>Savollar orasida erkin yurishingiz va belgilashingiz mumkin</li><li>Har bir to‘g‘ri javob uchun +10 XP</li></ul><button class="btn big" id="go">Testni boshlash</button></div>`,'tests');bindShell();
    $('#go').onclick=()=>startRun('test',i,T[i].map((q,qi)=>({...q,ref:[i,qi]})),`${i+1}-TEST`,DUR);break}
  case 'practice':{const c=decodeURIComponent(a||'');const pool=T.flatMap((t,ti)=>t?t.map((q,qi)=>({...q,ref:[ti,qi]})):[]).filter(q=>q.cat===c);if(!pool.length)return go('topics');
    startRun('practice',c,shuffle(pool).slice(0,20),'Mashq: '+c,0);break}
  case 'resume':if(!resumeRun())go('home');break;
  default:go(me?'home':'login')}}
window.addEventListener('beforeunload',e=>{if(run&&!run.done){e.preventDefault();e.returnValue=''}});
(me?restoreUnlocked():Promise.resolve()).then(()=>route());
})();
</script></body></html>
